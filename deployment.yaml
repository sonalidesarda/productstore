apiVersion: apps/v1
kind: Deployment
metadata:
  name: productstore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: productstore
  template:
    metadata:
      labels:
        app: productstore
    spec:
      containers:
      - name: productstore
        image: ghcr.io/sonalidesarda/productstore:latest
        imagePullPolicy: Always
        env:
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "host.docker.internal:9092"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: productstore-service
spec:
  selector:
    app: productstore
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer